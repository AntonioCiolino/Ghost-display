<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Ghost Display</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background-color: #000000; overflow: hidden; position: relative; }
        .hologram-container {
            width: 100vw;
            height: 100vw;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: scaleX(-1); /* Flips image so reflection reads correctly */
        }
        .hologram-container img { max-width: 100%; max-height: 100%; object-fit: contain; }
    </style>
</head>
<body>
    <div class="hologram-container">
        <!-- Change 'hologram.png' to match your image file name exactly -->
        <img src="image_f1f15117.png" alt="Ghost Source">
    </div>
    <br/>
    <div class="hologram-container">
        <!-- Change 'hologram.png' to match your image file name exactly -->
        <img src="ChatGPT DM Imagery.jpg" alt="Ghost Source">
    </div>

    
</body>
</html>
